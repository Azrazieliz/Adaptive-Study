name: Build Adaptive Study APK shell

on:
  push:
    branches: [ "main", "release-v3.26.1" ]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-adaptive-apk-shell.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release shell
        working-directory: android-wrapper
        run: gradle assembleRelease --no-daemon
      - name: Upload unsigned shell
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveStudy-v3.26.1-shell-unsigned
          path: android-wrapper/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Collect signing tools
        shell: bash
        run: |
          mkdir -p /tmp/apk-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/apk-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/apk-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/apk-tools/lib/
          LIBCPP="$(find "$ANDROID_HOME" -name 'libc++.so' -type f -print -quit)"
          test -n "$LIBCPP"
          cp "$LIBCPP" /tmp/apk-tools/
      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-tools
          path: /tmp/apk-tools
          if-no-files-found: error
          retention-days: 1
