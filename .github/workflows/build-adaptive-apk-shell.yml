name: Build Adaptive Study APK shell

on:
  push:
    branches: [ "apk-wrapper-v3.24.2" ]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-adaptive-apk-shell.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build unsigned release shell
        working-directory: android-wrapper
        run: gradle assembleRelease --no-daemon
      - name: Upload unsigned shell
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveStudy-shell-unsigned
          path: android-wrapper/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
